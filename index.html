
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Salon de Cécile - Oracles et Tarots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Great+Vibes&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #f4e4bc;
            --gold: #d4af37;
            --mahogany: #4a0404;
        }
        body {
            font-family: 'EB Garamond', serif;
            background-color: #1a0f0a;
            color: #d4af37;
            overflow-x: hidden;
        }
        .font-serif-ornate {
            font-family: 'Cinzel', serif;
        }
        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }
        .parchment {
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            color: #2c1e11;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #c9ad81;
        }
        .antique-border {
            border: 8px double var(--gold);
            outline: 2px solid var(--gold);
            outline-offset: -12px;
        }
        .sidebar-velvet {
            background: linear-gradient(to right, #4a0404, #2d0202);
            border-right: 3px solid var(--gold);
        }
        .wax-seal {
            background: radial-gradient(circle, #8b0000, #4a0000);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            border: 2px solid #a52a2a;
        }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Animations pour la boule de cristal */
        @keyframes float-slow {
          0%, 100% { transform: translateY(0) scale(1); }
          50% { transform: translateY(-10px) scale(1.02); }
        }
        @keyframes rotate-magic {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes pulse-glow {
          0%, 100% { opacity: 0.3; filter: blur(20px); }
          50% { opacity: 0.6; filter: blur(40px); }
        }
        .magic-flow {
          animation: rotate-magic 20s linear infinite;
        }
        .crystal-ball-glow {
          animation: pulse-glow 4s ease-in-out infinite;
        }
        .float-anim {
          animation: float-slow 6s ease-in-out infinite;
        }

        /* Grain d'image ancien */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            pointer-events: none;
            opacity: 0.15;
            z-index: 9999;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a0f0a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
